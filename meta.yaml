{% set release = load_file_regex(load_file='include/ProgramMetadata.hpp', regex_pattern='version *= *"([0-9.]+)-r([0-9]+)"', from_recipe_dir=True) %}

package:
  name: evg
  version: {{ release.group(1) }}_r{{ release.group(2) }}

source:
  path: .

requirements:
  build:
    - cmake >=3.15
    - make
    - gcc >=7.3.0
    - python =3.9
    - zlib
    - bzip2
    - xz
    - libdeflate

  run:
    - cmake >=3.15
    - gcc >=7.3.0
    - python =3.9
    - zlib
    - bzip2
    - xz
    - libdeflate
    - tabix
    - bwa
    - samtools
    - vg
    - graphaligner
    - paragraph
    - bayestyper ==1.5=h176a8bc_0
    - graphtyper
    - kmc
    - pangenie

test:
  commands:
    - EVG --version
    - graphvcf --version
    - fastAQ --version

channels:
    - kdm801
    - bioconda
    - defaults
    - conda-forge

about:
  home: https://github.com/JiaoLab2021/EVG
  license: MIT
  summary: A comprehensive benchmark of graph-based genetic variant genotyping algorithms on plant genomes for creating an accurate ensemble pipeline

extra:
  recipe-maintainers:
    - duzezhen
