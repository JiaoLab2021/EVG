name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: ./test

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libz-dev libbz2-dev liblzma-dev libdeflate-dev

    - name: Set GCC version to 11
      run: |
        sudo apt-get install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
        gcc --version
        g++ --version

    - name: Build project
      run: |
        cmake . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make -j2

    - name: Run tests
      run: |
        echo "Testing"
        ./graphvcf count -v $DATA_DIR/test.vcf.gz
        ./fastAQ count -i $DATA_DIR/test.fa
        python EVG.py -h
        test "$(./graphvcf --version)" = "$(./fastAQ --version)"
        test "$(./fastAQ --version)" = "$(python EVG.py --version)"

    - name: Test install
      run: |
        cmake --install . --prefix $RUNNER_TEMP/evg
        cd /
        test "$(readlink $RUNNER_TEMP/evg/bin/EVG)" = EVG.py
        $RUNNER_TEMP/evg/bin/EVG --version
        $RUNNER_TEMP/evg/bin/EVG -h
        $RUNNER_TEMP/evg/bin/graphvcf --version
        $RUNNER_TEMP/evg/bin/fastAQ --version
